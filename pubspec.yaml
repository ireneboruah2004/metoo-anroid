name: metoo
description: Women's safety app - tap-based SOS, siren, private complaint log and rights guide.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  audioplayers: ^6.1.0
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  flutter_volume_controller: ^1.3.2
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.0.0
  app_links: ^6.3.0
  quick_actions: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/siren.wav
