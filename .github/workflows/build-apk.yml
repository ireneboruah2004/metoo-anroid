name: Build MeToo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: bash tool/prepare.sh
      - run: cd build_app && flutter build apk --release --split-per-abi
      - name: Show APK details
        run: |
          export PATH=$PATH:$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)
          for f in build_app/build/app/outputs/flutter-apk/*.apk; do echo "== $f"; aapt dump badging "$f" | head -4; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: MeToo-apk
          path: build_app/build/app/outputs/flutter-apk/*.apk
